name: CI

# Runs on every push to main and on every pull request. Two parallel
# jobs:
#
#   build-and-test  -- npm install, build, utils + component tests, i18n
#                      lint. Fast (~2-3 min). No external dependencies.
#
#   rules-tests     -- Firestore emulator boot + tests/rules. Slower
#                      (~3-5 min) because of the Java + Firebase CLI
#                      setup and emulator cold start. Catches rule
#                      regressions before they hit production. Runs in
#                      parallel with the main job so total wall time
#                      is bounded by the slower one.
#
# Both jobs must pass for the workflow to go green. CI doesn't deploy
# anything -- Vercel handles deploy-on-push separately. Failed CI is
# a flag for the operator that the push needs attention.
#
# Setup required (one-time): none. The rules tests run against a fake
# project (mapa-rules-test) inside the emulator, no real credentials
# needed. (Unlike cleanup-orphans.yml which needs the service account.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual dispatch for testing the workflow itself
  workflow_dispatch:

# Cancel in-flight runs of the same workflow + branch when a new push
# arrives. Saves Actions minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + unit/component tests + i18n lint
    runs-on: ubuntu-latest

    # Dummy Firebase config. src/firebase.js calls initializeApp() +
    # getAuth() at module load, so ANY test that transitively imports a
    # src/utils/* module (e.g. tests/utils/dataExport.test.js ->
    # src/utils/dataExport.js -> src/firebase) throws
    # `auth/invalid-api-key` when these are undefined. No network call is
    # ever made -- the SDK only needs syntactically present values to
    # construct the client. These are NOT real credentials and must stay
    # fake: the real ones live in Vercel's env, never in the repo.
    env:
      VITE_FIREBASE_API_KEY: AIzaSyCI-not-a-real-key-000000000000000
      VITE_FIREBASE_AUTH_DOMAIN: mapa-ci.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: mapa-ci
      VITE_FIREBASE_STORAGE_BUCKET: mapa-ci.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # --legacy-peer-deps mirrors the local install (see install
        # commands in package.json / docs/recovery-and-hardening-plan.md);
        # several peer constraints in the eslint plugin tree don't
        # cleanly resolve under npm 10 strict mode.
        run: npm ci --legacy-peer-deps

      - name: Build (production)
        # Catches any compile-time error (missing import, broken JSX,
        # etc.) before Vercel's auto-deploy gets to it. Same command
        # Vercel runs.
        run: npm run build

      - name: Run utils tests
        run: npm test

      - name: Run component tests
        run: npm run test:components

      - name: Install functions dependencies
        working-directory: functions
        # functions/ is a separate npm package and the root `npm ci` does
        # not touch it. The tests load the handlers through createRequire,
        # so the real firebase-functions/v2/* entry points must resolve on
        # disk -- vi.mock cannot intercept a CJS require of a module that
        # isn't installed at all. Without this every tests/functions file
        # dies with "Cannot find module 'firebase-functions/v2/scheduler'".
        #
        # `npm install`, not `npm ci`: functions/package-lock.json is
        # gitignored (see functions/.gitignore), so there is no lockfile on
        # the runner for ci to read. Committing that lockfile would make
        # both CI and deploys reproducible and is worth doing separately --
        # it's a policy change for the functions package, not a CI fix.
        run: npm install

      - name: Run functions tests
        # tests/functions/ covers the Cloud Functions pure handlers
        # (verifyAccessCode, resetAgencySlots, glExpirySweep,
        # syncRequestFinancials). These existed but were never wired into
        # CI, so a regression in the functions bundle could reach main
        # unnoticed -- syncRequestFinancials writes the request funding
        # tally, so that gap mattered. They passed locally only because
        # functions/node_modules already existed on the dev machine.
        run: npm run test:functions

      - name: Lint i18n (patient surfaces)
        # `warn`-level rule, so this never fails the build by design --
        # it surfaces a count of hardcoded strings the operator should
        # know about. Promote to error level (see eslint.config.js)
        # once the baseline is 0 and we want to enforce it.
        run: npm run lint:i18n
        continue-on-error: true

      - name: Dependency audit (informational)
        # OWASP 2025 A03 (Software Supply Chain Failures). Surfaces
        # high/critical advisories in the web + functions dependency trees
        # as a CI signal. Non-blocking (continue-on-error) so a freshly
        # disclosed transitive advisory doesn't wall off an unrelated PR;
        # Dependabot opens the actual fix PRs. Review the output on merges.
        continue-on-error: true
        run: |
          echo "== web =="
          npm audit --audit-level=high || true
          echo "== functions =="
          (cd functions && npm audit --audit-level=high || true)

  rules-tests:
    name: Firestore rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Java (Firestore emulator requirement)
        # The Firestore emulator is a Java binary. firebase-tools 13+
        # requires JDK 21+; Temurin is the recommended distribution.
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Firebase CLI
        # Globally so the emulator can be invoked by npm scripts.
        # Pinned to v13 so a future major bump doesn't silently
        # change the test environment in CI.
        run: npm install -g firebase-tools@^13

      - name: Run rules tests
        # The npm script wraps the run in `firebase emulators:exec`,
        # which boots the firestore emulator on :8080, runs the
        # vitest suite, and tears down. ~10-15s emulator boot +
        # ~15-20s tests.
        run: npm run test:rules

  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest

    # Same dummy Firebase config as build-and-test -- the public pages the
    # smoke suite loads (landing / login / register / install) render
    # without any network call, so no real credentials are needed. The
    # webServer in playwright.config.js builds the production bundle and
    # serves it with `vite preview`, so this exercises exactly what ships.
    env:
      VITE_FIREBASE_API_KEY: AIzaSyCI-not-a-real-key-000000000000000
      VITE_FIREBASE_AUTH_DOMAIN: mapa-ci.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: mapa-ci
      VITE_FIREBASE_STORAGE_BUCKET: mapa-ci.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser
        # --with-deps pulls the OS libraries Chromium needs on the runner.
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        # playwright.config.js webServer builds + serves the bundle, then
        # the suite loads the public pages and asserts they mount.
        run: npm run test:e2e
