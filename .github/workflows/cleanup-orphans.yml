name: Cleanup Firestore orphans

# Runs the orphan-document cleanup script on a schedule + on demand.
# Audits documentContents/{id} that have no matching documents/{id}
# (usually leftovers from failed delete races — each is ~900KB of
# permanent Firestore garbage).
#
# HOW THIS RUNS (decided 2026-07-23): locally, on demand. NOT on a schedule.
#
# From the repo root (PowerShell):
#   $env:GOOGLE_APPLICATION_CREDENTIALS=".\service-account.json"
#   node scripts/cleanup-orphans.js            # audit only (dry-run default)
#   node scripts/cleanup-orphans.js --delete   # actually delete
#
# The script calls applicationDefault(), so GOOGLE_APPLICATION_CREDENTIALS must
# be set explicitly — it does NOT auto-discover ./service-account.json.
#
# The weekly cron was REMOVED because this repo is public and the job needs
# FIREBASE_SERVICE_ACCOUNT — a full Firebase Admin key with read/write access
# to every Firestore document, i.e. all patient PII. Rather than park that
# credential in a public repo's Actions secrets, the cleanup runs from the
# operator's machine, where the key already lives. The cron had never once
# succeeded anyway (every scheduled run since setup failed on the missing
# secret), so nothing is lost by dropping it.
#
# The workflow_dispatch trigger is kept so the job CAN be run from the Actions
# tab in a pinch — but that still requires setting the FIREBASE_SERVICE_ACCOUNT
# secret first (Settings → Secrets and variables → Actions → New), and the step
# below will fail with a clear message until you do. Prefer running locally.

on:
  workflow_dispatch:
    inputs:
      delete:
        description: 'Actually delete orphans (false = dry-run only)'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install firebase-admin
        run: npm install firebase-admin --no-save

      - name: Write service account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set. See workflow header for setup."
            exit 1
          fi
          echo "$SA_JSON" > /tmp/sa.json

      - name: Run cleanup (dry-run on schedule, optional delete on dispatch)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.delete }}" = "true" ]; then
            node scripts/cleanup-orphans.js --delete
          else
            node scripts/cleanup-orphans.js
          fi
