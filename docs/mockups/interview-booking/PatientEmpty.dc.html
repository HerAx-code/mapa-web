<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #F9FAFB; color: #111827; -webkit-font-smoothing: antialiased; }
    a { color: #0F6E56; text-decoration: none; } a:hover { color: #085041; }
  </style>
</helmet>

<div style="width: 390px; min-height: 640px; background: #F9FAFB; padding: 16px 12px 20px;">

  <!-- page header -->
  <div style="margin-bottom: 18px;">
    <p style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #9CA3AF;">Your interview</p>
    <h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: #111827;">Interviews</h1>
  </div>

  <!-- empty state -->
  <div style="background: #fff; border: 1px solid #F3F4F6; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); padding: 32px 24px; text-align: center; max-width: 340px; margin: 40px auto 0;">
    <div style="width: 56px; height: 56px; border-radius: 999px; background: #F3F4F6; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
    </div>
    <h2 style="margin: 0; font-size: 16px; font-weight: 600; color: #374151;">Wala pang bakanteng oras</h2>
    <p style="margin: 4px 0 0; font-size: 14px; color: #9CA3AF;">No interview times yet</p>
    <p style="margin: 14px 0 0; font-size: 14px; line-height: 1.55; color: #6B7280;">Bubuksan ng CRMC ang mga oras kapag sinusuri na ang inyong aplikasyon. Aabisuhan namin kayo.</p>
    <p style="margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: #9CA3AF;">CRMC opens interview times once your application is being assessed — we'll notify you.</p>

    <div style="margin: 22px auto 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: #fff; color: #374151; border: 1px solid #E5E7EB; padding: 0 18px; min-height: 44px; border-radius: 8px; font-size: 14px; font-weight: 500;">
      Check application status
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
