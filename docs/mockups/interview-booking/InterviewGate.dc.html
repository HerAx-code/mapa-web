<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #F9FAFB; color: #111827; -webkit-font-smoothing: antialiased; }
    a { color: #0F6E56; text-decoration: none; } a:hover { color: #085041; }
  </style>
</helmet>

<div style="width: 540px; min-height: 440px; background: #F9FAFB; padding: 24px; box-sizing: border-box;">

  <div style="background: #fff; border: 1px solid #F3F4F6; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); padding: 20px;">

    <!-- header -->
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
      <span style="width: 20px; height: 20px; border-radius: 999px; background: #C3EBDD; color: #06402F; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">3</span>
      <h3 style="margin: 0; font-size: 14px; font-weight: 600; color: #1F2937;">Interview</h3>
    </div>

    <!-- segmented control -->
    <p style="margin: 0 0 8px; font-size: 12px; font-weight: 600; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.04em;">How is this interview scheduled?</p>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #F3F4F6; border-radius: 10px; padding: 4px; margin-bottom: 18px;">
      <div style="text-align: center; padding: 9px 8px; border-radius: 7px; font-size: 13px; font-weight: 500; color: #6B7280;">Schedule myself</div>
      <div style="text-align: center; padding: 9px 8px; border-radius: 7px; font-size: 13px; font-weight: 600; color: #06402F; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.08);">Let patient self-book</div>
    </div>

    <!-- status: booking open -->
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; background: #E1F5EE; border: 1px solid #C3EBDD; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;">
      <div style="display: flex; align-items: flex-start; gap: 10px;">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #1DAF77; margin-top: 5px; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(29,175,119,0.2);"></span>
        <div>
          <p style="margin: 0; font-size: 13px; font-weight: 600; color: #06402F;">Booking is open</p>
          <p style="margin: 2px 0 0; font-size: 13px; color: #085041;">The patient can pick a time from published availability.</p>
        </div>
      </div>
      <span style="flex-shrink: 0; font-size: 13px; font-weight: 500; color: #0F6E56; white-space: nowrap;">Close</span>
    </div>

    <!-- booked result -->
    <div style="border: 1px solid #F3F4F6; border-radius: 10px; padding: 14px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F6E56" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path><path d="m9 16 2 2 4-4"></path></svg>
        <p style="margin: 0; font-size: 14px; font-weight: 600; color: #111827;">Patient booked — Wed, Sep 2 at 1:00 PM</p>
      </div>
      <p style="margin: 6px 0 0 24px; font-size: 13px; color: #6B7280;">Google Meet link attached · reminders scheduled (24h &amp; 1h)</p>
      <div style="margin: 12px 0 0 24px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #0F6E56;">
        Record outcome
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F6E56" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
