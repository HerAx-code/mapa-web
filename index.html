<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MAPA — Medical Assistance Portal Access | CRMC</title>

    <!-- PWA: theme color drives the Android status bar tint when the app is
         installed and opened in standalone mode. -->
    <meta name="theme-color" content="#3b82f6" />

    <!-- iOS-specific PWA capability flags. iOS doesn't read manifest fully;
         these meta tags are how it gets told the app is installable. The
         standard mobile-web-app-capable is the modern, cross-browser flag
         (the apple- prefix is kept for older iOS Safari). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MAPA" />

    <!-- Description shown in Play Store / Add-to-Home-Screen previews. -->
    <meta name="description" content="Apply for medical financial assistance at Cotabato Regional Medical Center. Patient portal for documents, applications, and Guarantee Letters." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- PWA install-prompt capture. Chrome fires beforeinstallprompt
         based on engagement heuristics; it can fire before React mounts.
         If we wait for useEffect to attach the listener, fast visits miss
         the event and the patient sees no Install button until they
         visit a second time. Stash the event on window so any React
         component can read it whenever it mounts. -->
    <script>
      window.__mapaDeferredInstallPrompt = null
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__mapaDeferredInstallPrompt = e
        // Notify any already-mounted React components.
        window.dispatchEvent(new CustomEvent('mapa-install-available'))
      })
      window.addEventListener('appinstalled', function () {
        window.__mapaDeferredInstallPrompt = null
        window.dispatchEvent(new CustomEvent('mapa-install-completed'))
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
